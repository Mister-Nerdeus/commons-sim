name: ci
on:
  push:
  pull_request:

jobs:
  build_test_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: "pnpm"
      - run: pnpm store prune
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm smoke:cli
      - run: pnpm determinism:check
