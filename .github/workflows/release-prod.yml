name: release-prod

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify_production_release:
    if: github.event_name == 'workflow_dispatch' || (github.base_ref == 'main' && github.head_ref == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - run: pnpm test
      - run: pnpm determinism:check
      - run: echo "Production release gate checks completed"
