name: Bug report
description: Report a bug or incorrect output
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: OS, Node version, commands, scenario file.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
